<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & support — Alygnn</title>
<meta name="description" content="Get in touch with the Alygnn team.">
<link rel="canonical" href="https://alygnn.com/contact.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #5D7FA3;
    --sage: #8CB69B;
    --bg: #F6F8F7;
    --card-bg: #FCFCFA;
    --text: #1A2530;
    --border: #DDE3E8;
    --mint: #6FBF8F;
    --rose: #D79A9A;
    --text-muted: #4A5968;
  }

  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-top: 64px; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 1000;
    background: rgba(246,248,247,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%; display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--brand); letter-spacing: -0.5px; text-decoration: none; }
  .logo span { color: var(--sage); }
  .nav-links { display: flex; gap: 24px; align-items: center; }
  .nav-links a { font-size: 14px; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }

  .page { max-width: 560px; margin: 0 auto; padding: 56px 6% 100px; }

  .doc-header { margin-bottom: 32px; }
  .doc-title { font-family: 'DM Serif Display', serif; font-size: 2.2rem; letter-spacing: -0.5px; margin-bottom: 8px; }
  .doc-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; }

  label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin: 20px 0 6px; }
  input, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    background: var(--card-bg); color: var(--text); resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); }
  textarea { min-height: 140px; }

  .btn-primary {
    margin-top: 28px; width: 100%;
    background: var(--brand); color: white; border: none; border-radius: 100px;
    padding: 15px 24px; font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .form-status {
    margin-top: 16px; font-size: 14px; padding: 12px 16px; border-radius: 10px; display: none;
  }
  .form-status.success { display: block; background: rgba(111,191,143,0.15); color: #2f7a4f; }
  .form-status.error { display: block; background: rgba(215,154,154,0.18); color: #a05858; }

  .alt-contact { margin-top: 40px; font-size: 13px; color: var(--text-muted); }
  .alt-contact a { color: var(--brand); }

  footer {
    padding: 40px 6%; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-muted); max-width: 760px; margin: 0 auto;
  }
  footer a { color: var(--text-muted); text-decoration: none; }
  footer a:hover { color: var(--brand); }

  @media (max-width: 640px) {
    footer { flex-direction: column; gap: 10px; text-align: center; }
  }

/* Alygnn responsive layout safeguards — CSS only, 2026-10-08. */
@media (max-width: 900px) {
  img, video, canvas, iframe { max-width: 100%; }
  input, select, textarea { max-width: 100%; }
  .grid > *, .form-grid > *, .layout > *, .checkout-grid > *, .stats-row > *, .page > * { min-width: 0; }
}
@media (max-width: 600px) {
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px; }
  .page, main, .main { max-width: 100%; }
  .card, .panel, .form-card, .section, .modal-box { max-width: 100%; }
}

@media(max-width:640px){.page{padding:36px 18px 72px}nav{padding:0 16px;gap:12px}.nav-links{gap:10px;min-width:0;flex-wrap:wrap;justify-content:flex-end}.nav-links a{font-size:12px}.doc-title{font-size:clamp(26px,8vw,35px)}}

/* Employer-app-inspired Help & support design — website only */
.support-page{max-width:730px;padding:42px 24px 80px;}
.support-header{display:flex;align-items:center;gap:18px;margin-bottom:25px;}
.support-hero-icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#EAF0F4;color:var(--brand);flex:0 0 auto;}
.support-hero-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.support-header .doc-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:30px;margin:0 0 4px;letter-spacing:-.6px;}
.support-header .doc-sub{font-size:14px;line-height:1.5;}
.support-panel{background:#FFF;border:1px solid var(--border);border-radius:23px;padding:25px 28px;margin-bottom:18px;box-shadow:0 12px 32px rgba(26,37,48,.035);}
.support-panel h2{font-size:19px;font-weight:600;margin:0 0 8px;}
.support-intro,.support-email p{font-size:13px;color:var(--text-muted);line-height:1.65;margin-bottom:17px;}
.support-panel label{font-weight:500;font-size:13px;margin:17px 0 8px;}
.support-panel input,.support-panel select,.support-panel textarea{display:block;width:100%;border:1px solid var(--border);border-radius:13px;padding:13px 16px;font:400 14px 'DM Sans',sans-serif;color:var(--text);background:#fff;outline:none;}
.support-panel :is(input,select,textarea):focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(93,127,163,.09);}
.support-panel textarea{min-height:145px;resize:vertical;line-height:1.6;}
.support-panel .btn-primary{width:auto;min-width:155px;border-radius:13px;font-weight:500;padding:13px 22px;margin-top:20px;}
.support-email p{margin-bottom:13px;}
.support-email-link{display:inline-flex;border:1px solid var(--border);border-radius:13px;padding:13px 17px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;overflow-wrap:anywhere;}
.support-email-link:hover{color:var(--brand);border-color:var(--brand);}
.identity-fields[hidden]{display:none!important;}
@media(max-width:640px){.support-page{padding:25px 17px 65px;}.support-header{gap:12px}.support-hero-icon{width:48px;height:48px;border-radius:14px}.support-header .doc-title{font-size:25px}.support-panel{padding:22px 19px;border-radius:20px}.support-panel input,.support-panel select,.support-panel textarea{font-size:16px}.support-panel .btn-primary{width:100%;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo" id="contact-home-logo">Alygnn<span>.</span></a>
  <div class="nav-links">
    <a href="index.html" id="contact-back-home">← Back to Alygnn</a>
  </div>
</nav>

<main class="page support-page">
  <div class="support-header">
    <div class="support-hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></div>
    <div><h1 class="doc-title">Help &amp; support</h1><p class="doc-sub">Send the Alygnn team a message without leaving the website.</p></div>
  </div>

  <section class="support-panel" aria-labelledby="contact-panel-title">
    <h2 id="contact-panel-title">Contact Alygnn</h2>
    <p class="support-intro" id="support-signed-in">Tell us what you need help with. We'll use your details to respond by email.</p>
    <form id="contact-form">
      <div class="identity-fields" id="contact-identity-fields">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <label for="topic">What do you need help with?</label>
      <select id="topic" name="topic" required>
        <option value="Account & login">Account &amp; login</option>
        <option value="Employer verification">Employer verification</option>
        <option value="Billing & plan">Billing &amp; plan</option>
        <option value="Team access">Team access</option>
        <option value="Jobs & candidates">Jobs &amp; candidates</option>
        <option value="Report a problem">Report a problem</option>
        <option value="Privacy request">Privacy request</option>
        <option value="Other">Other</option>
      </select>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us what you need help with." minlength="5" maxlength="5000" required></textarea>
      <button type="submit" class="btn-primary" id="submit-btn">Send message</button>
      <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section class="support-panel support-email" aria-labelledby="email-support-title">
    <h2 id="email-support-title">Email support</h2>
    <p>You can also contact Alygnn directly.</p>
    <a href="mailto:admin@alygnn.com" class="support-email-link">admin@alygnn.com</a>
  </section>
</main>

<footer>
  <a href="index.html" id="contact-footer-home">Alygnn</a>
  <span><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  
function alygnnAuthStorageKey() {
  let tabId = window.sessionStorage.getItem('alygnn_auth_tab_id');
  if (!tabId) {
    tabId = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
    window.sessionStorage.setItem('alygnn_auth_tab_id', tabId);
  }
  return `alygnn-auth-${tabId}`;
}

const { createClient } = supabase;
  const sb = createClient(
      'https://auth.alygnn.com',
      'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
      {
    auth: {
      storage: window.sessionStorage,
      storageKey: alygnnAuthStorageKey(),
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
    );


  async function setContactHomeDestination() {
    const logo = document.getElementById('contact-home-logo');
    const back = document.getElementById('contact-back-home');
    const footerHome = document.getElementById('contact-footer-home');

    let home = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const explicitEmployer =
      String(params.get('from') || '').toLowerCase() === 'employer' ||
      String(params.get('role') || '').toLowerCase() === 'employer';

    const referrer = String(document.referrer || '').toLowerCase();
    const employerReferrer =
      referrer.includes('/employers.html') ||
      referrer.includes('/employer-account.html') ||
      referrer.includes('/employer-dashboard.html') ||
      referrer.includes('/candidates.html');

    if (explicitEmployer || employerReferrer) {
      home = 'employer-account.html';
    }

    try {
      const { data: { session } } = await sb.auth.getSession();

      if (session?.user?.id) {
        const { data: profile } = await sb
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .maybeSingle();

        const role = String(
          profile?.role ||
          session.user.user_metadata?.role ||
          ''
        ).toLowerCase();

        if (role === 'employer') {
          home = 'employer-account.html';
        } else if (role) {
          home = 'index.html';
        }
      }
    } catch (error) {
      console.warn('Could not resolve contact home destination:', error);
    }

    if (logo) logo.href = home;
    if (back) back.href = home;
    if (footerHome) footerHome.href = home;
  }

  setContactHomeDestination();

  async function hydrateEmployerContact() {
    const fromEmployer = new URLSearchParams(location.search).get('from') === 'employer';
    if (!fromEmployer) return;
    const intro = document.getElementById('support-signed-in');
    const identity = document.getElementById('contact-identity-fields');
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session?.user?.email) return;
      const user = session.user;
      const email = user.email;
      const name = String(user.user_metadata?.full_name || user.user_metadata?.name || email.split('@')[0]).trim();
      document.getElementById('name').value = name;
      document.getElementById('email').value = email;
      if (intro) intro.textContent = `Signed in as ${email}. We'll include your account email so our team can respond.`;
      if (identity) identity.hidden = true;
    } catch (error) { console.warn('Contact account prefill unavailable:', error); }
  }
  hydrateEmployerContact();

  const form = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = 'form-status';
    status.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      message: `[${document.getElementById('topic').value}]\n\n${document.getElementById('message').value.trim()}`
    };

    try {
      const { error } = await sb.functions.invoke('send-contact-message', {
        body: payload
      });
      if (error) throw error;

      status.classList.add('success');
      status.textContent = "Thanks — your message is on its way. We'll reply by email soon.";
      form.reset();
    } catch (err) {
      status.classList.add('error');
      status.textContent = "Something went wrong sending your message. Please email us directly at admin@alygnn.com.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send message';
    }
  });
</script>

</body>
</html>
