<script id="alygnn-entry-theme-critical">
(function(){
  const media=window.matchMedia
    ? window.matchMedia('(prefers-color-scheme: dark)')
    : null;

  function normalize(value){
    value=String(value||'').toLowerCase().trim();
    if(value==='system'||value==='system-default'||value==='default') return 'auto';
    return ['auto','light','dark'].includes(value)?value:'auto';
  }

  function accountType(){
    try{
      return String(localStorage.getItem('alygnn_account_type')||'candidate').toLowerCase()==='employer'
        ? 'employer'
        : 'candidate';
    }catch(_error){
      return 'candidate';
    }
  }

  function preference(){
    const type=accountType();
    try{
      if(type==='employer'){
        return normalize(
          localStorage.getItem('alygnnEmployerTheme') ||
          localStorage.getItem('alygnnTheme') ||
          localStorage.getItem('alygnn-theme') ||
          'auto'
        );
      }

      return normalize(
        localStorage.getItem('alygnnCandidateTheme') ||
        localStorage.getItem('alygnn_candidate_theme') ||
        localStorage.getItem('alygnnTheme') ||
        localStorage.getItem('alygnn-theme') ||
        'auto'
      );
    }catch(_error){
      return 'auto';
    }
  }

  function resolved(){
    return media&&media.matches?'dark':'light';
  }

  function apply(){
    const theme=resolved();
    const root=document.documentElement;
    root.dataset.theme=theme;
    root.style.colorScheme=theme;
    root.style.backgroundColor=theme==='dark'?'#071722':'#F6F8F7';

    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      meta.setAttribute('content',theme==='dark'?'#071722':'#F6F8F7');
    }
  }

  apply();

  if(media){
    const onChange=()=>apply();
    media.addEventListener?.('change',onChange);
    if(!media.addEventListener) media.addListener?.(onChange);
  }

  window.AlygnnEntryTheme={apply,accountType,preference,resolved};
})();
</script>

<script>

// Remove the Android-only native cover only AFTER the actual PNG is decoded
// and the HTML loader has had an opportunity to paint two animation frames.
// The cover prevents the blank WebView handoff; no timing is added to routing.
(function notifyNativeLoaderPainted(){
  let sent=false;
  let attempts=0;
  function reveal(){
    if(sent) return;
    if(!window.AlygnnStartupBridge || typeof window.AlygnnStartupBridge.ready!=='function'){
      if(++attempts<30) setTimeout(reveal,80);
      return;
    }
    sent=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      try { window.AlygnnStartupBridge.ready(); } catch(_e) {}
    }));
  }
  const image=document.querySelector('#alygnn-native-handoff img');
  if(!image){ reveal(); return; }
  // <picture> may select a different dark-mode source: decode the actually
  // selected image before asking native Android to reveal the WebView.
  let finished=false;
  function finish(){
    if(finished) return;
    finished=true;
    if(typeof image.decode==='function' && image.complete && image.naturalWidth>0){
      image.decode().catch(()=>{}).then(reveal);
    }else{
      reveal();
    }
  }
  if(image.complete && image.naturalWidth>0){ finish(); return; }
  image.addEventListener('load',finish,{once:true});
  image.addEventListener('error',finish,{once:true});
  // Failsafe: native also has a safety timeout if image loading stalls.
  setTimeout(finish,3000);
})();
