<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F8F7">
<script id="alygnn-splash-theme-critical">
(function(){
  const media = window.matchMedia
    ? window.matchMedia('(prefers-color-scheme: dark)')
    : null;

  function normalize(value){
    value=String(value||'').toLowerCase().trim();
    if(value==='system'||value==='system-default'||value==='default') return 'auto';
    return ['auto','light','dark'].includes(value)?value:'auto';
  }

  function readTheme(){
    let accountType='candidate';
    try{
      accountType=String(localStorage.getItem('alygnn_account_type')||'candidate').toLowerCase();
    }catch(_){ }

    const primaryKey = accountType==='employer'
      ? 'alygnnEmployerTheme'
      : 'alygnnCandidateTheme';

    let value='auto';
    try{
      value =
        localStorage.getItem(primaryKey) ||
        localStorage.getItem('alygnnTheme') ||
        localStorage.getItem('alygnn-theme') ||
        localStorage.getItem('alygnn_candidate_theme') ||
        'auto';
    }catch(_){ }

    return normalize(value);
  }

  function apply(){
    const preference=readTheme();
    const theme = preference==='dark'
      ? 'dark'
      : preference==='light'
        ? 'light'
        : (media && media.matches ? 'dark' : 'light');

    const root=document.documentElement;
    root.dataset.theme=theme;
    root.style.colorScheme=theme;
    root.style.backgroundColor=theme==='dark'?'#071722':'#F6F8F7';

    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      meta.setAttribute('content',theme==='dark'?'#071722':'#F6F8F7');
    }
  }

  apply();

  if(media){
    media.addEventListener?.('change',()=>{
      if(readTheme()==='auto') apply();
    });
  }

  window.AlygnnSplashTheme={apply};
})();
</script>
<title>Alygnn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --brand:#5D7FA3;
  --sage:#8CB69B;
  --bg:#F6F8F7;
  --text:#172333;
  --muted:#6E8092;
  --track:#E2E9EE;
  --glow:rgba(93,127,163,.12);
}

html[data-theme="dark"]{
  --bg:#071722;
  --text:#F6F8FA;
  --muted:#9EACB9;
  --track:#213342;
  --glow:rgba(93,127,163,.18);
}

html,
body{
  width:100%;
  min-height:100%;
  background:var(--bg);
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(24px + env(safe-area-inset-top))
    24px
    calc(24px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 38%,var(--glow),transparent 34%),
    var(--bg);
  color:var(--text);
  font-family:'DM Sans',Arial,sans-serif;
  transition:background-color .2s ease,color .2s ease;
}

.splash{
  width:min(360px,88vw);
  text-align:center;
  transform:translateY(-3vh);
  opacity:1;
  transition:opacity .22s ease,transform .22s ease;
}

body.is-leaving .splash{
  opacity:0;
  transform:translateY(-3vh) scale(.985);
}

.logo{
  display:inline-block;
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(54px,15vw,72px);
  line-height:.95;
  letter-spacing:-2px;
  color:var(--brand);
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

.logo-dot{
  color:var(--sage);
}

.tagline{
  margin-top:18px;
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  font-weight:700;
  letter-spacing:.01em;
}

.loading-track{
  position:relative;
  width:116px;
  height:3px;
  margin:25px auto 0;
  overflow:hidden;
  border-radius:999px;
  background:var(--track);
}

.loading-bar{
  position:absolute;
  top:0;
  bottom:0;
  left:-48%;
  width:48%;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    var(--brand),
    var(--sage)
  );
  animation:alygnn-loading 1.15s cubic-bezier(.4,0,.2,1) infinite;
}

@keyframes alygnn-loading{
  0%{
    transform:translateX(0);
    opacity:.45;
  }
  45%{
    opacity:1;
  }
  100%{
    transform:translateX(310%);
    opacity:.55;
  }
}

@media (prefers-reduced-motion:reduce){
  .loading-bar{
    left:0;
    width:100%;
    animation:none;
    opacity:.8;
  }
}
</style>
</head>
<body>
<main class="splash" aria-label="Alygnn is loading">
  <div class="logo">Alygnn<span class="logo-dot">.</span></div>
  <div class="tagline" id="splash-message">Finding your fit.</div>
  <div class="loading-track" aria-hidden="true">
    <div class="loading-bar"></div>
  </div>
</main>
<script>

const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


const ALYGNN_EMPLOYER_LOADING_MESSAGES=["Building your team.", "Finding your next hire.", "Connecting you with talent.", "Preparing your hiring workspace.", "Matching talent to opportunity.", "Getting your candidates ready.", "Organizing your hiring pipeline.", "Bringing your workspace together.", "Loading your hiring dashboard.", "Preparing your next move.", "Finding talent that fits.", "Getting your team in place.", "Preparing your candidate matches.", "Powering up your hiring workspace.", "Bringing the right people closer.", "Getting your hiring tools ready.", "Preparing your recruiting workspace.", "Connecting you to your next hire.", "Getting everything ready to hire.", "Helping you build what’s next."];

function alygnnEmployerLoadingMessage(){
  const storageKey='alygnnEmployerLastLoadingMessage';
  let last='';
  try{last=localStorage.getItem(storageKey)||'';}catch(_error){}

  let choices=ALYGNN_EMPLOYER_LOADING_MESSAGES;
  if(last && choices.length>1){
    choices=choices.filter(message=>message!==last);
  }

  const message=choices[Math.floor(Math.random()*choices.length)]||'Building your team.';
  try{localStorage.setItem(storageKey,message);}catch(_error){}
  return message;
}

const SPLASH_MIN_MS=1250;
const splashStartedAt=Date.now();


function setSplashMessageForAccountType(accountType){
  const node=document.getElementById('splash-message');
  if(!node)return;
  node.textContent=String(accountType||'').toLowerCase()==='employer'
    ? alygnnEmployerLoadingMessage()
    : 'Finding your fit.';
}

try{
  setSplashMessageForAccountType(
    localStorage.getItem('alygnn_account_type')||'candidate'
  );
}catch(_error){
  setSplashMessageForAccountType('candidate');
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function leaveSplash(destination){
  const elapsed=Date.now()-splashStartedAt;
  const remaining=Math.max(0,SPLASH_MIN_MS-elapsed);

  if(remaining){
    await wait(remaining);
  }

  document.body.classList.add('is-leaving');
  await wait(220);

  window.location.replace(destination);
}

(async function routeApp(){
  let destination='app-start.html';

  try{
    const {data,error}=await sb.auth.getSession();

    if(!error && data.session){
      const accountType=
        localStorage.getItem('alygnn_account_type') ||
        'candidate';

      setSplashMessageForAccountType(accountType);

      destination=
        accountType==='employer'
          ?'app-employer-dashboard.html'
          :'app-account.html';
    }

  }catch(err){
    console.error(err);
  }

  await leaveSplash(destination);
})();
</script>
</body>
</html>
