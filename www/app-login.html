<script id="alygnn-theme-critical">
(function(){
  const ACCOUNT_THEME_TYPE='candidate';
  const media=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function normalize(value){
    value=String(value||'').toLowerCase().trim();
    if(value==='system'||value==='system-default'||value==='default') return 'auto';
    return ['auto','light','dark'].includes(value)?value:'';
  }
  function read(key){try{return localStorage.getItem(key)}catch(_error){return null}}
  function write(key,value){try{localStorage.setItem(key,value)}catch(_error){}}
  function preference(){
    let pref=normalize(read('alygnnTheme'));
    if(pref) return pref;
    const keys=ACCOUNT_THEME_TYPE==='employer'
      ? ['alygnnEmployerTheme','alygnn_employer_theme']
      : ['alygnnCandidateTheme','alygnn_candidate_theme'];
    for(const key of keys){
      pref=normalize(read(key));
      if(pref){write('alygnnTheme',pref);return pref;}
    }
    for(const key of ['alygnn_theme','alygnn-theme']){
      pref=normalize(read(key));
      if(pref){write('alygnnTheme',pref);return pref;}
    }
    return 'auto';
  }
  function resolved(){
    const pref=preference();
    if(pref==='dark'||pref==='light') return pref;
    return media&&media.matches?'dark':'light';
  }
  function apply(){
    const pref=preference();
    const theme=resolved();
    const root=document.documentElement;
    root.dataset.theme=theme;
    root.dataset.themePreference=pref;
    root.dataset.effectiveTheme=theme;
    root.style.colorScheme=theme;
    root.style.backgroundColor=theme==='dark'?'#061821':'#F6F8F7';
    const meta=document.getElementById('alygnn-theme-color');
    if(meta)meta.setAttribute('content',theme==='dark'?'#061821':'#F6F8F7');
  }
  apply();
  if(media){
    const onChange=()=>{if(preference()==='auto')apply();};
    media.addEventListener?.('change',onChange);
    if(!media.addEventListener)media.addListener?.(onChange);
  }
  window.addEventListener('pageshow',apply);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)apply();});
  window.addEventListener('storage',event=>{
    if(['alygnnTheme','alygnnEmployerTheme','alygnnCandidateTheme','alygnn_theme','alygnn-theme','alygnn_employer_theme','alygnn_candidate_theme'].includes(event.key))apply();
  });
  window.AlygnnTheme={apply,preference,resolved};
})();
</script>

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);

const ACCOUNT_TYPE='candidate';
const WORKSPACE_PAGE='app-workspaces.html?after_login=1&preferred=candidate';

function showMessage(text,type){
  const m=document.getElementById('message');
  m.textContent=text;
  m.className='message '+type;
}

function setLoading(button,loading,loadingText,normalText){
  button.disabled=loading;
  button.textContent=loading?loadingText:normalText;
}

function friendlyError(error){
  const raw=String(error?.message||'').toLowerCase();
  if(raw.includes('invalid login credentials')||raw.includes('invalid credentials'))return'Incorrect email or password. Please try again.';
  if(raw.includes('email not confirmed')||raw.includes('confirm your email'))return'Please verify your email before signing in.';
  if(raw.includes('fetch')||raw.includes('network')||raw.includes('failed to fetch'))return'Unable to connect. Please check your internet connection.';
  if(raw.includes('too many requests')||raw.includes('rate limit'))return'Too many attempts. Please wait a few minutes and try again.';if(raw.includes('main activity')||raw.includes('scopes without modifying'))return'Google sign-in could not start. Please update Alygnn and try again.';
  return error?.message||'Unable to sign in. Please try again.';
}

async function redirectIfLoggedIn(){
  const params=new URLSearchParams(location.search);
  if(params.has('logout'))return;

  const {data}=await sb.auth.getSession();
  if(data?.session){
    location.replace(WORKSPACE_PAGE);
  }
}

async function signIn(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const button=document.getElementById('sign-in-btn');

  if(!email){
    showMessage('Please enter your email address.','error');
    return;
  }

  if(!password){
    showMessage('Please enter your password.','error');
    return;
  }

  setLoading(button,true,'Signing in…','Sign in');

  const {error}=await sb.auth.signInWithPassword({email,password});

  if(error){
    showMessage(friendlyError(error),'error');
    setLoading(button,false,'Signing in…','Sign in');
    return;
  }

  localStorage.setItem('alygnn_account_type',ACCOUNT_TYPE);
  showMessage('Welcome back. Checking your workspaces…','success');

  setTimeout(()=>location.replace(WORKSPACE_PAGE),300);
}

const GOOGLE_WEB_CLIENT_ID='725784285039-f3a7u1r21l9a5vgqd5phqif8uadkk11r.apps.googleusercontent.com';
const SUPABASE_FUNCTIONS_URL='https://auth.alygnn.com/functions/v1';
const SUPABASE_PUBLIC_KEY='sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG';
let socialLoginPlugin=null;
let socialLoginInitialized=false;

function nativePlatform(){
  try{return window.Capacitor?.getPlatform?.() || ''}catch(_){return ''}
}

function isNativeAlygnnApp(){
  try{
    if(window.Capacitor?.isNativePlatform?.())return true;
    return nativePlatform()==='android' || nativePlatform()==='ios';
  }catch(_){return false}
}

function isAndroidNative(){
  return nativePlatform()==='android';
}

function getSocialLoginPlugin(){
  if(socialLoginPlugin)return socialLoginPlugin;

  const cap=window.Capacitor;
  if(!cap || !cap.isNativePlatform?.()){
    throw new Error('Native Google sign-in is only available inside the Alygnn app.');
  }

  // Plain HTML Capacitor apps do not always expose registerPlugin() on
  // window.Capacitor. Prefer the native plugin proxy Capacitor injects.
  if(cap.Plugins?.SocialLogin){
    socialLoginPlugin=cap.Plugins.SocialLogin;
    return socialLoginPlugin;
  }

  // Keep compatibility with builds that do expose registerPlugin().
  if(typeof cap.registerPlugin==='function'){
    socialLoginPlugin=cap.registerPlugin('SocialLogin');
    return socialLoginPlugin;
  }

  // Last-resort direct Capacitor bridge for non-bundled/plain HTML builds.
  if(typeof cap.nativePromise==='function'){
    socialLoginPlugin={
      initialize:(options)=>cap.nativePromise('SocialLogin','initialize',options||{}),
      login:(options)=>cap.nativePromise('SocialLogin','login',options||{}),
      logout:(options)=>cap.nativePromise('SocialLogin','logout',options||{})
    };
    return socialLoginPlugin;
  }

  throw new Error('Google sign-in could not connect to the native Alygnn bridge. Reopen the app after syncing Android.');
}

async function ensureNativeGoogleInitialized(){
  if(socialLoginInitialized)return getSocialLoginPlugin();
  const plugin=getSocialLoginPlugin();
  await plugin.initialize({
    google:{
      webClientId:GOOGLE_WEB_CLIENT_ID,
      mode:'online'
    }
  });
  socialLoginInitialized=true;
  return plugin;
}

async function validateGoogleIntent(session,intent='login'){
  if(!session?.access_token)throw new Error('Google sign-in did not create an Alygnn session.');

  const response=await fetch(SUPABASE_FUNCTIONS_URL+'/validate-google-login',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey':SUPABASE_PUBLIC_KEY,
      'Authorization':'Bearer '+session.access_token
    },
    body:JSON.stringify({
      intent:intent==='signup'?'signup':'login'
    })
  });

  let payload={};
  try{payload=await response.json()}catch(_){}
  if(!response.ok)throw new Error(payload.error||'Could not verify this Google account.');
  return payload;
}

async function signOutRejectedGoogle(plugin){
  try{await sb.auth.signOut({scope:'local'})}catch(_){}
  try{await plugin?.logout?.({provider:'google'})}catch(_){}
}

async function candidateGoogleAccessAllowed(user){
  try{
    const {data,error}=
      await sb.rpc(
        'get_my_workspace_context'
      );

    if(!error && data && typeof data==='object'){
      if(data.has_candidate===true){
        return true;
      }

      if(
        data.authenticated===true &&
        data.has_candidate===false
      ){
        return false;
      }
    }
  }catch(error){
    console.warn(
      'Candidate workspace check failed:',
      error
    );
  }

  const role=String(
    user?.user_metadata?.account_type||
    user?.user_metadata?.role||
    user?.app_metadata?.account_type||
    user?.app_metadata?.role||
    ''
  ).toLowerCase().trim();

  return ![
    'employer',
    'employer_team',
    'team_member'
  ].includes(role);
}

async function candidateGoogleAccountState(user){
  let profile=null;

  try{
    const {data,error}=await sb
      .from('profiles')
      .select('role,resume_file_path,resume_data,preferences')
      .eq('id',user.id)
      .maybeSingle();

    if(!error){
      profile=data||null;
    }
  }catch(error){
    console.warn('Could not read candidate Google profile:',error);
  }

  const role=String(
    profile?.role||
    user?.user_metadata?.account_type||
    user?.user_metadata?.role||
    user?.app_metadata?.account_type||
    user?.app_metadata?.role||
    ''
  ).toLowerCase().trim();

  if(
    role==='employer'||
    role==='employer_team'||
    role==='team_member'
  ){
    return {kind:'employer',role};
  }

  const identities=Array.isArray(user?.identities)?user.identities:[];
  const hasEmailIdentity=identities.some(identity=>identity?.provider==='email');
  const registered=user?.app_metadata?.alygnn_registered===true;

  const hasCandidateData=Boolean(
    profile?.resume_file_path||
    profile?.resume_data||
    profile?.preferences
  );

  const createdAt=Date.parse(user?.created_at||'');
  const legacyCandidate=
    Number.isFinite(createdAt) &&
    Date.now()-createdAt>60*60*1000 &&
    ['candidate','seeker','employee'].includes(role);

  if(
    registered||
    hasEmailIdentity||
    hasCandidateData||
    legacyCandidate
  ){
    return {kind:'candidate',role};
  }

  return {kind:'new',role};
}

async function createCandidateFromGoogle(session,user){
  const validation=await validateGoogleIntent(session,'signup');

  if(!validation?.allowed){
    throw new Error('Alygnn could not create your candidate account with Google.');
  }

  const fullName=String(
    user?.user_metadata?.full_name||
    user?.user_metadata?.name||
    ''
  ).trim();

  const {data:updateData,error:updateError}=await sb.auth.updateUser({
    data:{
      ...(user?.user_metadata||{}),
      full_name:fullName,
      name:fullName,
      account_type:'candidate',
      role:'candidate',
      accepted_terms:true,
      accepted_privacy:true,
      EmailFlow:'google'
    }
  });

  if(updateError)throw updateError;

  const savedUser=updateData?.user||user;

  const {error:profileError}=await sb
    .from('profiles')
    .upsert(
      {
        id:savedUser.id,
        role:'candidate',
        full_name:fullName
      },
      {onConflict:'id'}
    );

  if(profileError){
    console.warn('Candidate Google profile save warning:',profileError);
  }

  localStorage.setItem('alygnn_account_type','candidate');
  return savedUser;
}

async function nativeGoogleLogin(button){
  const plugin=await ensureNativeGoogleInitialized();

  const login=await plugin.login({
    provider:'google',
    options:{
      filterByAuthorizedAccounts:false
    }
  });

  const idToken=login?.result?.idToken;
  if(!idToken){
    throw new Error('Google did not return a valid sign-in token.');
  }

  const {data,error}=await sb.auth.signInWithIdToken({
    provider:'google',
    token:idToken
  });

  if(error)throw error;

  const session=
    data?.session||
    (await sb.auth.getSession()).data?.session;

  const user=data?.user||session?.user;

  if(!session?.user){
    throw new Error('Google sign-in did not finish. Please try again.');
  }

  const state=await candidateGoogleAccountState(user);

  if(state.kind==='employer'){
    await signOutRejectedGoogle(plugin);
    showMessage(
      'This Google account is connected to an employer workspace. Please use Employer Sign In.',
      'error'
    );
    return false;
  }

  if(state.kind==='new'){
    await createCandidateFromGoogle(session,user);
    showMessage('Google account created. Opening Alygnn…','success');
  }else{
    localStorage.setItem('alygnn_account_type','candidate');
    showMessage('Welcome back. Opening Alygnn…','success');
  }

  setTimeout(
    ()=>location.replace(WORKSPACE_PAGE),
    250
  );

  return true;
}

async function googleLogin(){
  const button=document.getElementById('google-btn');
  const original=button.innerHTML;
  button.disabled=true;
  button.textContent='Signing in with Google…';
  localStorage.setItem('alygnn_account_type',ACCOUNT_TYPE);

  try{
    // app-login.html is a native-app page. Never fall back to web OAuth here.
    // This prevents Google sign-in from opening alygnn.com/Chrome.
    if(!isNativeAlygnnApp()){
      throw new Error('Google sign-in is available inside the Alygnn mobile app.');
    }
    const completed=await nativeGoogleLogin(button);
    if(!completed){
      button.disabled=false;
      button.innerHTML=original;
    }
    return;
  }catch(error){
    console.error('Google sign-in failed:',error);
    const raw=String(error?.message||error||'').toLowerCase();
    const cancelled=raw.includes('cancel')||raw.includes('user_cancelled')||raw.includes('canceled');
    showMessage(cancelled?'Google sign-in was canceled.':friendlyError(error),'error');
    button.disabled=false;
    button.innerHTML=original;
  }
}

function applyPlatformLoginUI(){
  const apple=document.getElementById('apple-btn');
  if(apple && isAndroidNative())apple.style.display='none';
}


document.getElementById('back-btn').addEventListener('click',()=>location.href='app-start.html');
document.getElementById('show-btn').addEventListener('click',event=>{
  const input=document.getElementById('password');
  const showing=input.type==='text';
  input.type=showing?'password':'text';
  event.currentTarget.textContent=showing?'Show':'Hide';
});
document.getElementById('forgot-btn').addEventListener('click',()=>location.href='app-forgot-password.html');
document.getElementById('sign-in-btn').addEventListener('click',signIn);
document.getElementById('google-btn').addEventListener('click',googleLogin);
document.getElementById('apple-btn')?.addEventListener('click',()=>showMessage('Apple sign-in is not connected yet.','error'));
document.getElementById('switch-btn').addEventListener('click',()=>location.href='app-employer-login.html');
document.getElementById('password').addEventListener('keydown',event=>{if(event.key==='Enter')signIn()});

applyPlatformLoginUI();
window.AlygnnTheme?.apply?.();
redirectIfLoggedIn();
</script>
</body></html>
