<script id="alygnn-chat-theme-critical">
(function(){
  const media=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;

  function normalize(value){
    value=String(value||'').toLowerCase().trim();
    if(value==='auto'||value==='system-default'||value==='default') return 'system';
    return ['system','light','dark'].includes(value)?value:'system';
  }

  function role(){
    try{
      return String(new URLSearchParams(location.search).get('role')||'candidate').toLowerCase()==='employer'
        ?'employer'
        :'candidate';
    }catch(_){
      return 'candidate';
    }
  }

  function preference(){
    try{
      if(role()==='employer'){
        return normalize(
          localStorage.getItem('alygnnEmployerTheme') ||
          localStorage.getItem('alygnnTheme') ||
          localStorage.getItem('alygnn_candidate_theme') ||
          localStorage.getItem('alygnn-theme') ||
          'system'
        );
      }

      return normalize(
        localStorage.getItem('alygnnTheme') ||
        localStorage.getItem('alygnn_candidate_theme') ||
        localStorage.getItem('alygnn-theme') ||
        localStorage.getItem('alygnnEmployerTheme') ||
        'system'
      );
    }catch(_){
      return 'system';
    }
  }

  const pref=preference();
  const theme=pref==='system'
    ?(media&&media.matches?'dark':'light')
    :pref;

  const root=document.documentElement;
  root.dataset.theme=theme;
  root.dataset.effectiveTheme=theme;
  root.style.colorScheme=theme;

  let meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){
    meta=document.createElement('meta');
    meta.name='theme-color';
    document.head.appendChild(meta);
  }

  meta.setAttribute(
    'content',
    theme==='dark'
      ?(role()==='employer'?'#0B111A':'#061821')
      :'#F6F8F7'
  );
})();
</script>

<script>
const sb=supabase.createClient(
  'https://auth.alygnn.com',
  'sb_publishable_3l8krRh6WCyvKfNumWDBDw_C6CKr7rG',
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const $=id=>document.getElementById(id);

const esc=value=>
  String(value??'')
    .replace(
      /[&<>"']/g,
      char=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[char])
    );

let session=null;
let role='candidate';
let applicationId='';
let conversationId='';
let conversation=null;
let application=null;
let job=null;
let profile=null;
let channel=null;
let sending=false;
let mutating=false;
let contextCandidateName='';
let contextJobTitle='';

function fmt(value){
  const date=new Date(value);

  return Number.isNaN(
    date.getTime()
  )
    ?''
    :date.toLocaleTimeString(
      undefined,
      {
        hour:'numeric',
        minute:'2-digit'
      }
    );
}

function cleanIdentity(value,generic=[]){
  const text=String(value??'').trim();

  if(!text)return '';

  return generic.includes(
    text.toLowerCase()
  )
    ?''
    :text;
}

function profileCandidateName(){
  return (
    cleanIdentity(
      profile?.full_name,
      ['candidate','applicant']
    )||
    cleanIdentity(
      profile?.name,
      ['candidate','applicant']
    )||
    cleanIdentity(
      [
        profile?.first_name,
        profile?.last_name
      ]
        .filter(Boolean)
        .join(' '),
      ['candidate','applicant']
    )||
    cleanIdentity(
      application?.candidate_name,
      ['candidate','applicant']
    )||
    cleanIdentity(
      application?.applicant_name,
      ['candidate','applicant']
    )||
    cleanIdentity(
      application?.full_name,
      ['candidate','applicant']
    )||
    cleanIdentity(
      [
        application?.first_name,
        application?.last_name
      ]
        .filter(Boolean)
        .join(' '),
      ['candidate','applicant']
    )||
    cleanIdentity(
      String(
        application?.candidate_email||
        application?.email||
        ''
      ).split('@')[0],
      ['candidate','applicant']
    )
  );
}

function candidateName(){
  return (
    cleanIdentity(
      contextCandidateName,
      ['candidate','applicant']
    )||
    cleanIdentity(
      conversation?.candidate_name,
      ['candidate','applicant']
    )||
    profileCandidateName()||
    'Candidate'
  );
}

function companyName(){
  return (
    cleanIdentity(job?.company)||
    cleanIdentity(job?.company_name)||
    cleanIdentity(job?.employer_name)||
    cleanIdentity(
      conversation?.company_name,
      ['employer','company']
    )||
    'Employer'
  );
}

function jobTitle(){
  return (
    cleanIdentity(
      contextJobTitle,
      ['job application','position']
    )||
    cleanIdentity(
      conversation?.job_title,
      ['job application','position']
    )||
    cleanIdentity(job?.title)||
    cleanIdentity(
      application?.job_title
    )||
    'Job application'
  );
}

function setNotice(text,error=false){
  const notice=$('notice');

  notice.hidden=!text;
  notice.className=
    'notice'+
    (error?' error':'');
  notice.textContent=text||'';
}

function archived(){
  if(!conversation)return false;

  return Boolean(
    role==='employer'
      ?conversation.employer_archived_at
      :conversation.candidate_archived_at
  );
}

function renderContext(){
  $('person').textContent=
    role==='employer'
      ?candidateName()
      :companyName();

  $('job').textContent=
    jobTitle();

  $('rule').textContent=
    role==='employer'
      ?'You control the first contact. The candidate can reply after you start the conversation.'
      :'This conversation was opened by the employer after you applied.';

  $('more').hidden=
    !conversation?.id;

  $('archive-chat').textContent=
    archived()
      ?'Move to inbox'
      :'Archive conversation';
}

async function metadata(){
  if(!applicationId){
    return;
  }

  const applicationResult=await sb
    .from('applications')
    .select('*')
    .eq(
      'id',
      applicationId
    )
    .maybeSingle();

  if(applicationResult.error){
    throw applicationResult.error;
  }

  application=
    applicationResult.data||
    null;

  if(!application){
    return;
  }

  const jobResult=await sb
    .from('jobs')
    .select('*')
    .eq(
      'id',
      application.job_id
    )
    .maybeSingle();

  if(!jobResult.error){
    job=
      jobResult.data||
      null;
  }

  const candidateId=
    application.candidate_id||
    application.user_id||
    application.profile_id;

  if(candidateId){
    const byId=await sb
      .from('profiles')
      .select('*')
      .eq(
        'id',
        candidateId
      )
      .maybeSingle();

    if(
      !byId.error &&
      byId.data
    ){
      profile=byId.data;
    }

    if(!profile){
      const byUser=await sb
        .from('profiles')
        .select('*')
        .eq(
          'user_id',
          candidateId
        )
        .maybeSingle();

      if(
        !byUser.error &&
        byUser.data
      ){
        profile=byUser.data;
      }
    }
  }
}

async function findConversation(){
  let result=null;

  if(conversationId){
    result=await sb
      .from('application_conversations')
      .select('*')
      .eq(
        'id',
        conversationId
      )
      .maybeSingle();
  }else if(applicationId){
    result=await sb
      .from('application_conversations')
      .select('*')
      .eq(
        'application_id',
        applicationId
      )
      .maybeSingle();
  }

  if(
    result?.error
  ){
    throw result.error;
  }

  conversation=
    result?.data||
    null;

  /*
   * One thread per candidate + job:
   * older application links can still find the canonical conversation.
   */
  if(
    !conversation &&
    application
  ){
    const candidateId=
      application.candidate_id||
      application.user_id||
      application.profile_id;

    if(
      candidateId &&
      application.job_id
    ){
      const fallback=await sb
        .from('application_conversations')
        .select('*')
        .eq(
          'job_id',
          String(
            application.job_id
          )
        )
        .eq(
          'candidate_id',
          candidateId
        )
        .maybeSingle();

      if(fallback.error){
        throw fallback.error;
      }

      conversation=
        fallback.data||
        null;
    }
  }

  if(conversation){
    conversationId=
      String(
        conversation.id
      );

    applicationId=
      String(
        conversation.application_id||
        applicationId||
        ''
      );

    const hidden=
      role==='employer'
        ?conversation.employer_hidden_at
        :conversation.candidate_hidden_at;

    if(hidden){
      conversation=null;
    }
  }

  renderContext();
}

async function loadMessages(){
  if(!conversation){
    $('messages').innerHTML=`
      <div class="empty">
        <strong>
          ${
            role==='employer'
              ?'Send the first message'
              :'No conversation yet'
          }
        </strong>
        ${
          role==='employer'
            ?'The candidate will not see a chat until you send the first message.'
            :'The employer has not started a conversation for this application.'
        }
      </div>
    `;

    if(role==='candidate'){
      $('composer').style.display='none';
    }

    return;
  }

  const result=await sb
    .from('application_messages')
    .select('*')
    .eq(
      'conversation_id',
      conversation.id
    )
    .order(
      'created_at',
      {
        ascending:true
      }
    );

  if(result.error)throw result.error;

  const rows=result.data||[];

  $('messages').innerHTML=
    rows.length
      ?rows
        .map(message=>`
          <div
            class="bubble ${
              String(message.sender_id)===
              String(session.user.id)
                ?'mine'
                :'theirs'
            }">
            ${esc(String(message.body||'').trim())}
            <span class="stamp">
              ${esc(fmt(message.created_at))}
            </span>
          </div>
        `)
        .join('')
      :`
        <div class="empty">
          <strong>Conversation started</strong>
          No messages yet.
        </div>
      `;

  $('messages').scrollTop=
    $('messages').scrollHeight;

  await markRead();
}

async function markRead(){
  if(!conversation)return;

  try{
    await sb.rpc(
      'mark_application_conversation_read',
      {
        p_conversation_id:
          conversation.id
      }
    );
  }catch(error){
    console.warn(error);
  }
}

function subscribe(){
  if(channel){
    sb.removeChannel(channel);
  }

  if(!conversation)return;

  channel=sb
    .channel(
      'chat-'+
      conversation.id
    )
    .on(
      'postgres_changes',
      {
        event:'INSERT',
        schema:'public',
        table:'application_messages',
        filter:
          `conversation_id=eq.${conversation.id}`
      },
      async()=>{
        await findConversation();
        await loadMessages();
      }
    )
    .subscribe();
}

async function send(){
  const body=
    $('input').value.trim();

  if(
    !body||
    sending
  ){
    return;
  }

  sending=true;
  $('send').disabled=true;
  setNotice('');

  try{
    if(!conversation){
      if(role!=='employer'){
        throw new Error(
          'Only the employer can start this conversation.'
        );
      }

      if(!applicationId){
        throw new Error(
          'Application information is missing.'
        );
      }

      const result=await sb.rpc(
        'start_application_conversation_v3',
        {
          p_application_id:
            applicationId,

          p_body:
            body,

          p_candidate_name:
            candidateName(),

          p_job_title:
            jobTitle()
        }
      );

      if(result.error){
        throw result.error;
      }

      conversationId=
        String(
          result.data?.conversation_id||
          ''
        );

      $('input').value='';

      await findConversation();
      await loadMessages();
      subscribe();
      return;
    }

    const result=await sb
      .from('application_messages')
      .insert({
        conversation_id:
          conversation.id,

        sender_id:
          session.user.id,

        body
      });

    if(result.error){
      throw result.error;
    }

    $('input').value='';
    await findConversation();
    await loadMessages();
  }catch(error){
    console.error(error);

    setNotice(
      error?.message||
      'Message could not be sent.',
      true
    );
  }finally{
    sending=false;
    $('send').disabled=false;
    $('input').focus();
  }
}

async function archiveConversation(){
  if(
    !conversation?.id||
    mutating
  ){
    return;
  }

  mutating=true;
  $('more').disabled=true;

  try{
    const toArchive=
      !archived();

    const result=await sb.rpc(
      'archive_application_conversation',
      {
        p_conversation_id:
          conversation.id,

        p_archived:
          toArchive
      }
    );

    if(result.error){
      throw result.error;
    }

    setNotice(
      toArchive
        ?'Conversation archived.'
        :'Conversation moved back to your inbox.'
    );

    await findConversation();
    renderContext();
    $('chat-menu').hidden=true;
  }catch(error){
    console.error(error);

    setNotice(
      error?.message||
      'Conversation could not be updated.',
      true
    );
  }finally{
    mutating=false;
    $('more').disabled=false;
  }
}

async function deleteConversation(){
  if(
    !conversation?.id||
    mutating
  ){
    return;
  }

  const name=
    role==='employer'
      ?candidateName()
      :companyName();

  if(
    !confirm(
      `Delete the conversation with ${name} from your Messages?\n\nThis removes it only from your side. The other person keeps their copy. If a new message is sent later, the conversation can appear again.`
    )
  ){
    return;
  }

  mutating=true;
  $('more').disabled=true;

  setNotice(
    'Removing conversation…'
  );

  try{
    let result=await sb.rpc(
      'hide_application_conversation',
      {
        p_conversation_id:
          conversation.id
      }
    );

    if(
      result.error &&
      String(
        result.error.message||
        ''
      )
        .toLowerCase()
        .includes('function')
    ){
      result=await sb.rpc(
        'delete_application_conversation',
        {
          p_conversation_id:
            conversation.id
        }
      );
    }

    if(result.error){
      throw result.error;
    }

    if(channel){
      sb.removeChannel(channel);
    }

    location.replace(
      'app-messages.html?role='+
      role
    );
  }catch(error){
    console.error(error);

    setNotice(
      error?.message||
      'Conversation could not be removed.',
      true
    );

    $('more').disabled=false;
    mutating=false;
  }
}

$('send').onclick=send;

$('input').addEventListener(
  'keydown',
  event=>{
    if(
      event.key==='Enter' &&
      !event.shiftKey
    ){
      event.preventDefault();
      send();
    }
  }
);

$('back').onclick=()=>{
  location.href=
    'app-messages.html?role='+
    role;
};

$('more').onclick=event=>{
  event.stopPropagation();
  $('chat-menu').hidden=
    !$('chat-menu').hidden;
};

$('archive-chat').onclick=
  archiveConversation;

$('delete-chat').onclick=
  deleteConversation;

document.addEventListener(
  'click',
  event=>{
    if(
      !event.target.closest(
        '.header'
      )
    ){
      $('chat-menu').hidden=true;
    }
  }
);

(async()=>{
  const query=
    new URLSearchParams(
      location.search
    );

  role=
    query.get('role')==='employer'
      ?'employer'
      :'candidate';

  applicationId=
    String(
      query.get('application')||
      ''
    );

  conversationId=
    String(
      query.get('conversation')||
      ''
    );

  if(role==='employer'){
    contextCandidateName=
      String(
        query.get('candidate')||
        ''
      ).trim();

    contextJobTitle=
      String(
        query.get('job')||
        ''
      ).trim();

    try{
      const saved=JSON.parse(
        sessionStorage.getItem(
          'alygnnMessageContext'
        )||
        'null'
      );

      if(
        saved &&
        (
          !applicationId ||
          String(
            saved.applicationId||
            ''
          )===applicationId
        )
      ){
        contextCandidateName=
          contextCandidateName||
          String(
            saved.candidateName||
            ''
          ).trim();

        contextJobTitle=
          contextJobTitle||
          String(
            saved.jobTitle||
            ''
          ).trim();
      }
    }catch(_error){}
  }

  if(
    !applicationId &&
    !conversationId
  ){
    setNotice(
      'Conversation information is missing.',
      true
    );

    $('composer').style.display='none';
    return;
  }

  const {
    data,
    error
  }=await sb.auth.getSession();

  if(
    error||
    !data.session
  ){
    location.replace(
      'app-login.html'
    );
    return;
  }

  session=data.session;

  try{
    /*
     * When opening by conversation ID, resolve its current application first.
     */
    if(
      conversationId &&
      !applicationId
    ){
      const initial=await sb
        .from('application_conversations')
        .select('application_id')
        .eq(
          'id',
          conversationId
        )
        .maybeSingle();

      if(initial.error){
        throw initial.error;
      }

      applicationId=
        String(
          initial.data?.application_id||
          ''
        );
    }

    await metadata();
    await findConversation();

    if(
      role==='employer' &&
      conversation &&
      applicationId &&
      (
        contextCandidateName||
        contextJobTitle
      )
    ){
      const sync=await sb.rpc(
        'sync_application_conversation_identity',
        {
          p_application_id:
            applicationId,

          p_candidate_name:
            candidateName(),

          p_job_title:
            jobTitle()
        }
      );

      if(sync.error){
        console.warn(
          'Could not refresh conversation identity:',
          sync.error
        );
      }else{
        await findConversation();
      }
    }

    renderContext();

    if(
      role==='candidate' &&
      !conversation
    ){
      $('composer').style.display='none';
    }

    await loadMessages();
    subscribe();
  }catch(error){
    console.error(error);

    setNotice(
      error?.message||
      'Conversation could not be loaded.',
      true
    );

    $('composer').style.display='none';
  }
})();
</script>
